<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Usuários</title>
    <link rel="stylesheet" href="styles/estilo.css">
</head>
<body>
    <main>
        <header>
            <h1>Gestão de Usuários</h1>
            <p>Cadastre, consulte, atualize e remova usários em um só lugar.</p>
        </header>

        <section>
            <div>
                <span>Dados do usuário</span>
                <h2>Gerenciar cadastro</h2>
            </div>
            
            <div class="fields">
                <label class="field">
                    <span>ID:</span>
                    <input type="text" id="id" placeholder="Ex: 007" autocomplete="off">
                </label>

                <label class="field">
                    <span>CPF:</span>
                    <input type="text" id="cpf" placeholder="CPF" autocomplete="off">
                </label>
                <!-- ESTE ABAIXO É NOVO -->
                <label class="field">
                    <span>Email:</span>
                    <input type="text" id="email" placeholder="Email" autocomplete="off">
                </label>
            </div>
            
            <div class="action">
                <button type="button" onclick="criar()" class="primary">Criar Usuário</button>
                <button type="button" onclick="buscarTodos()" class="secondary">Buscar Todos</button>
                <button type="button" onclick="alterar()" class="secondary">Alterar</button>
                <button type="button" onclick="deletar()" class="danger">Deletar</button>
            </div>

            <p class="feedback" id="resultado"></p>
        </section>

        <section>
            <div>
                <span>CADASTRADOS</span>
                <h2>Lista de usuários</h2>
            </div>
            <ul id="listaUsuarios"></ul>
        </section>
    </main>

    <script src="scripts/index.js"></script>
</body>
</html>
