<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha página HTML</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

    <!-- Cabecalho -->
    <header>
        <h1>Minha primeira página WEB - HTML</h1>
        <a href="./sobre.html">
            Sobre
        </a>
    </header>

    <!-- Conteudo principal -->
    <main>
        <!-- Lista ordenada e não ordenada -->
        <section>
            <h2>Seção de Listas:</h2>

            <h3>Lista Ordenada</h3>
            <ol>
                <li>Rio de Janeiro</li>
                <li>Joinville</li>
                <li>Floripa</li>
            </ol>

            <h3>Lista Não Ordenada</h3>
            <ul>
                <li>Batata</li>
                <li>Batata1</li>
                <li>Batata2</li>
            </ul>
        </section>
        <!-- Ibagens e Videos -->
        <section>
            <h2>Seção de Imagens e Vídeo</h2>
            <div>
                <img width="100" src="./imgs/dog.jpg" alt="Cachorro na praia">
                <img width="100" src="https://vetex.vet.br/blog/wp-content/uploads/2021/12/Cachorro-na-praia-930x620.jpg" alt="Outro cachorro na praia">
            </div>
            <br />
            <div>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/1ROfSD0eU5E?si=93bunHXDBXb57li0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </section>
        
        <!-- Formularios -->
        <section class="last">
            <h2>Formulário simples</h2>

            <form id="formulario">
                <div>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="batata" />
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" />
                </div>

                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" />
                </div>

                <div>
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" placeholder="batata"></textarea>
                </div>

                <div>
                    <label for="idade">Idade: </label>
                    <input type="number" id="idade" min="10" max="20" />
                </div>

                <div>
                    <label for="cor">Cor: </label>
                    <input type="color" id="cor" />
                </div>

                <div>
                    <label for="anexo">Anexo: </label>
                    <input type="file" id="anexo">
                </div>

                <button type="reset">Limpar</button>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <!-- Rodape -->
    <footer id="rodape">
        <p>
            &copy; Todos os direitos reservados
        </p>
    </footer>
    <script src="./scripts/exemplo.js"></script>
</body>
</html>
